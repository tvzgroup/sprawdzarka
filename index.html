<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LexCorp Legislator | System Prawny V2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .glass-inner {
            background: rgba(3, 7, 18, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #f3f4f6;
        }
        .glass-input:focus {
            border-color: rgba(99, 102, 241, 0.6);
            outline: none;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.15);
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .animated-bg {
            background: linear-gradient(-45deg, #030712, #0f172a, #1e1b4b, #311042);
            background-size: 400% 400%;
            animation: gradientBG 18s ease infinite;
        }
        /* Customowy scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }
    </style>
</head>
<body class="animated-bg text-gray-100 min-h-screen flex flex-col font-sans selection:bg-indigo-500 selection:text-white">

    <!-- Efektowne świecące kule w tle -->
    <div class="fixed top-[-10%] left-[-10%] w-[40vw] h-[40vw] bg-indigo-600/20 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[40vw] h-[40vw] bg-cyan-600/20 rounded-full blur-[120px] pointer-events-none"></div>

    <!-- Nagłówek -->
    <header class="border-b border-white/10 bg-slate-950/40 sticky top-0 z-50 backdrop-blur-xl">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-tr from-indigo-600 to-violet-500 p-2.5 rounded-2xl text-white font-bold shadow-lg shadow-indigo-500/25 border border-white/20">⚖️</div>
                <div class="flex items-end space-x-2">
                    <span class="text-xl font-extrabold tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-300 to-cyan-400">LexCorp Legislator</span>
                    <span class="text-xs font-mono text-indigo-400 bg-indigo-500/10 px-1.5 py-0.5 rounded border border-indigo-500/20">V2.0</span>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="eksportujBaze()" class="text-xs bg-slate-900/80 hover:bg-slate-800 text-gray-300 px-3.5 py-2 rounded-xl border border-white/10 transition cursor-pointer flex items-center space-x-1.5 shadow-sm">
                    <span>💾 Eksportuj</span>
                </button>
                <button onclick="resetujWszystko()" class="text-xs bg-rose-950/40 hover:bg-rose-900/60 text-rose-300 px-3.5 py-2 rounded-xl border border-rose-800/30 transition cursor-pointer">
                    <span>Reset danych</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Główny kontener -->
    <main class="max-w-7xl mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-12 gap-6 flex-grow w-full relative z-10">
        
        <!-- Lewy panel: Rejestr (4 kolumny) -->
        <section class="lg:col-span-4 glass rounded-3xl p-6 flex flex-col h-[calc(100vh-130px)]">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-sm font-bold text-white tracking-wide flex items-center space-x-2">
                    <span>📁</span> <span>Rejestr Aktów Prawnych</span>
                </h2>
                <button onclick="nowyAkt()" class="text-xs bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-medium px-3.5 py-2 rounded-xl shadow-lg shadow-indigo-600/30 transition cursor-pointer border border-indigo-400/20">
                    + Nowy Akt
                </button>
            </div>

            <!-- Wyszukiwarka -->
            <div class="mb-4">
                <input type="text" id="szukajInput" oninput="filtrujListe()" placeholder="Szukaj w rejestrze..." class="glass-input w-full px-4 py-2.5 rounded-xl text-xs transition shadow-inner">
            </div>

            <!-- Lista projektów -->
            <div id="listaAktow" class="space-y-2.5 flex-grow overflow-y-auto pr-1">
                <!-- Generowane dynamicznie -->
            </div>
        </section>

        <!-- Prawy panel: Edytor i Sprawdzarka (8 kolumn) -->
        <section class="lg:col-span-8 glass rounded-3xl p-6 flex flex-col h-[calc(100vh-130px)]">
            
            <!-- Górny pasek formularza -->
            <div class="flex flex-col sm:flex-row gap-3 mb-4">
                <input type="text" id="tytulAktu" placeholder="Tytuł / Nazwa aktu prawnego (np. Ustawa o...)" class="glass-input flex-grow px-4 py-3 rounded-2xl text-sm font-semibold transition shadow-inner">
                <select id="statusAktu" class="glass-input px-4 py-3 rounded-2xl text-xs font-medium transition cursor-pointer">
                    <option value="Projekt roboczy" class="bg-slate-900">Projekt roboczy</option>
                    <option value="Do audytu ZTP" class="bg-slate-900">Do audytu ZTP</option>
                    <option value="Zweryfikowany" class="bg-slate-900">Zweryfikowany</option>
                </select>
            </div>

            <!-- Zakładki przełączania -->
            <div class="flex space-x-2 border-b border-white/10 pb-3 mb-4">
                <button onclick="zmienZakladke('generator')" id="tabGenBtn" class="px-4 py-2 rounded-xl text-xs font-semibold bg-indigo-600 text-white transition cursor-pointer shadow-lg shadow-indigo-600/25 border border-indigo-400/20">📝 Pisanie Ustawy</button>
                <button onclick="zmienZakladke('audyt')" id="tabAudytBtn" class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-800/80 text-gray-300 hover:bg-slate-700 transition cursor-pointer">🔍 Sprawdzarka i Audyt ZTP</button>
            </div>

            <!-- Widok 1: Generator / Pisanie ustaw -->
            <div id="widokGenerator" class="flex flex-col flex-grow space-y-3">
                <p class="text-xs text-gray-400">Twórz i edytuj strukturę przepisów merytorycznych, przejściowych oraz końcowych.</p>
                <textarea id="trescAktu" placeholder="Wpisz treść przepisów (Rozdział 1, Art. 1. ...)..." class="glass-input w-full flex-grow p-4 rounded-2xl text-sm font-mono transition resize-none shadow-inner leading-relaxed min-h-[320px]"></textarea>
            </div>

            <!-- Widok 2: Sprawdzarka i Audyt ZTP -->
            <div id="widokAudyt" class="hidden flex flex-col flex-grow space-y-3">
                <div class="flex justify-between items-center">
                    <p class="text-xs text-gray-400">Sprawdź projekt pod kątem reguł techniki prawodawczej lub użyj automatycznej autokorekty.</p>
                    <button onclick="uruchomSprawdzarke()" class="text-xs bg-cyan-600/80 hover:bg-cyan-500 text-white font-medium px-3 py-1.5 rounded-xl transition cursor-pointer shadow-md shadow-cyan-600/20 border border-cyan-400/20">⚡ Szybki Test ZTP</button>
                </div>
                <textarea id="audytAktu" placeholder="Wpisz uwagi z audytu, luki prawne, niezgodności z ZTP lub użyj Szybkiego Testu..." class="glass-input w-full flex-grow p-4 rounded-2xl text-sm transition resize-none shadow-inner leading-relaxed min-h-[320px]"></textarea>
            </div>

            <!-- Stopka edytora -->
            <div class="flex justify-between items-center mt-5 pt-4 border-t border-white/10">
                <button onclick="usunAkt()" id="btnUsun" class="text-xs text-rose-400 hover:text-rose-300 px-4 py-2 rounded-xl hover:bg-rose-500/10 transition cursor-pointer hidden">Usuń ten akt</button>
                <div class="flex space-x-3 ml-auto">
                    <button onclick="zapiszAkt()" class="bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-medium px-6 py-3 rounded-2xl text-xs shadow-lg shadow-indigo-600/30 transition cursor-pointer border border-indigo-400/20">
                        Zapisz Projekt
                    </button>
                </div>
            </div>

        </section>

    </main>

    <!-- Skrypt logiki -->
    <script>
        let bazaAktow = [];
        let aktywnyId = null;

        try {
            const zczytane = localStorage.getItem('lexcorp_baza_v2');
            if (zczytane) bazaAktow = JSON.parse(zczytane);
        } catch(e) {
            bazaAktow = [];
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (bazaAktow.length > 0) {
                wybierzAkt(bazaAktow[0].id);
            } else {
                nowyAkt();
            }
            odswiezListe();
        });

        function odswiezListe(daneDoWyswietlenia = null) {
            const kontener = document.getElementById('listaAktow');
            const lista = daneDoWyswietlenia || bazaAktow;

            if (lista.length === 0) {
                kontener.innerHTML = '<div class="text-center py-10 text-xs text-gray-500 italic">Brak zapisanych projektów.</div>';
                return;
            }

            kontener.innerHTML = '';
            lista.forEach(akt => {
                const div = document.createElement('div');
                div.className = `p-3.5 rounded-2xl cursor-pointer border transition flex flex-col space-y-1.5 ${akt.id === aktywnyId ? 'bg-indigo-600/20 border-indigo-500/50 shadow-md' : 'bg-slate-900/40 border-white/5 hover:border-white/15'}`;
                div.onclick = () => wybierzAkt(akt.id);
                
                div.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-bold text-gray-200 truncate max-w-[160px]">${akt.tytul || 'Nowy projekt'}</span>
                        <span class="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-indigo-300 border border-white/5">${akt.status}</span>
                    </div>
                    <div class="text-[10px] text-gray-500 flex justify-between">
                        <span>Aktualizacja:</span>
                        <span>${new Date(akt.data).toLocaleDateString()}</span>
                    </div>
                `;
                kontener.appendChild(div);
            });
        }

        function nowyAkt() {
            aktywnyId = Date.now();
            document.getElementById('tytulAktu').value = '';
            document.getElementById('statusAktu').value = 'Projekt roboczy';
            document.getElementById('trescAktu').value = '';
            document.getElementById('audytAktu').value = '';
            document.getElementById('btnUsun').classList.add('hidden');
            zmienZakladke('generator');
            odswiezListe();
        }

        function wybierzAkt(id) {
            aktywnyId = id;
            const akt = bazaAktow.find(a => a.id === id);
            if (!akt) return;

            document.getElementById('tytulAktu').value = akt.tytul || '';
            document.getElementById('statusAktu').value = akt.status || 'Projekt roboczy';
            document.getElementById('trescAktu').value = akt.tresc || '';
            document.getElementById('audytAktu').value = akt.audyt || '';
            document.getElementById('btnUsun').classList.remove('hidden');
            
            zmienZakladke('generator');
            odswiezListe();
        }

        function zapiszAkt() {
            const tytul = document.getElementById('tytulAktu').value.trim();
            const status = document.getElementById('statusAktu').value;
            const tresc = document.getElementById('trescAktu').value;
            const audyt = document.getElementById('audytAktu').value;

            if (!tytul) {
                alert("Wprowadź tytuł aktu prawnego.");
                return;
            }

            const nowyWpis = {
                id: aktywnyId,
                tytul,
                status,
                tresc,
                audyt,
                data: new Date().toISOString()
            };

            const index = bazaAktow.findIndex(a => a.id === aktywnyId);
            if (index !== -1) {
                bazaAktow[index] = nowyWpis;
            } else {
                bazaAktow.unshift(nowyWpis);
            }

            localStorage.setItem('lexcorp_baza_v2', JSON.stringify(bazaAktow));
            odswiezListe();
            alert("Projekt został zapisany pomyślnie!");
        }

        function usunAkt() {
            if (!confirm("Czy na pewno chcesz usunąć ten projekt?")) return;
            bazaAktow = bazaAktow.filter(a => a.id !== aktywnyId);
            localStorage.setItem('lexcorp_baza_v2', JSON.stringify(bazaAktow));
            
            if (bazaAktow.length > 0) {
                wybierzAkt(bazaAktow[0].id);
            } else {
                nowyAkt();
            }
            odswiezListe();
        }

        function filtrujListe() {
            const fraza = document.getElementById('szukajInput').value.toLowerCase();
            const wynik = bazaAktow.filter(a => a.tytul.toLowerCase().includes(fraza) || a.tresc.toLowerCase().includes(fraza));
            odswiezListe(wynik);
        }

        function zmienZakladke(ktora) {
            const btnGen = document.getElementById('tabGenBtn');
            const btnAudyt = document.getElementById('tabAudytBtn');
            const widokGen = document.getElementById('widokGenerator');
            const widokAudyt = document.getElementById('widokAudyt');

            if (ktora === 'generator') {
                btnGen.className = "px-4 py-2 rounded-xl text-xs font-semibold bg-indigo-600 text-white transition cursor-pointer shadow-lg shadow-indigo-600/25 border border-indigo-400/20";
                btnAudyt.className = "px-4 py-2 rounded-xl text-xs font-semibold bg-slate-800/80 text-gray-300 hover:bg-slate-700 transition cursor-pointer";
                widokGen.classList.remove('hidden');
                widokAudyt.classList.add('hidden');
            } else {
                btnAudyt.className = "px-4 py-2 rounded-xl text-xs font-semibold bg-indigo-600 text-white transition cursor-pointer shadow-lg shadow-indigo-600/25 border border-indigo-400/20";
                btnGen.className = "px-4 py-2 rounded-xl text-xs font-semibold bg-slate-800/80 text-gray-300 hover:bg-slate-700 transition cursor-pointer";
                widokAudyt.classList.remove('hidden');
                widokGen.classList.add('hidden');
            }
        }

        function uruchomSprawdzarke() {
            const tresc = document.getElementById('trescAktu').value;
            const poleAudytu = document.getElementById('audytAktu');
            zmienZakladke('audyt');

            if (!tresc.trim()) {
                poleAudytu.value = "⚠️ Brak treści przepisów do sprawdzenia. Wpisz najpierw projekt w zakładce 'Pisanie Ustawy'.";
                return;
            }

            let raport = "--- RAPORT ZE SPRAWDZARKI ZTP (Algorytm lokalny) ---\n\n";
            let bledy = 0;

            // Proste heurystyki sprawdzające Zasady Techniki Prawodawczej
            if (!tresc.toLowerCase().includes("ustawa")) {
                raport += "• [Zalecenie] Brak słowa kluczowego 'Ustawa' w treści lub nagłówku.\n";
                bledy++;
            }
            if (!tresc.toLowerCase().includes("art.")) {
                raport += "• [Błąd] Nie wykryto skrótu 'Art.' oznaczającego artykuły w tekście.\n";
                bledy++;
            }
            if (!tresc.toLowerCase().includes("wchodzi w życie")) {
                raport += "• [Uwaga ZTP] Brak klauzuli o wejściu w życie aktu prawnego.\n";
                bledy++;
            }

            if (bledy === 0) {
                raport += "✅ Nie wykryto podstawowych uchybień strukturalnych w tekście przepisów.\n";
            } else {
                raport += `\nZnaleziono potencjalne uchybienia: ${bledy}. Wprowadź korektę redakcyjną.`;
            }

            poleAudytu.value = raport;
        }

        function eksportujBaze() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(bazaAktow, null, 2));
            const anchor = document.createElement('a');
            anchor.setAttribute("href", dataStr);
            anchor.setAttribute("download", "lexcorp_baza_aktow.json");
            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();
        }

        function resetujWszystko() {
            if (confirm("Czy na pewno chcesz wyczyścić wszystkie lokalne projekty?")) {
                localStorage.removeItem('lexcorp_baza_v2');
                location.reload();
            }
        }
    </script>
</body>
</html>
